services:
  demo:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: Source/PaymentIntegration.Demo/Dockerfile
    environment:
      DEMO_PAYMENT_BASE_URL: http://payments:8080
      DEMO_ACME_BASE_URL: http://acme:8080
      ACME_API_KEY: ${ACME_API_KEY:-}
      DEMO_CUSTOMER_ID: ${DEMO_CUSTOMER_ID:-860e4537-28e4-4b83-a399-d4bd13f63a26}
      DEMO_CUSTOMER_CARD_ID: ${DEMO_CUSTOMER_CARD_ID:-8ee3f008-84f5-4152-80a5-21821abdd045}
      DEMO_SUB_MERCHANT_ID: ${DEMO_SUB_MERCHANT_ID:-ZAP9193145856}
      DEMO_AMOUNT: ${DEMO_AMOUNT:-1999}
      DEMO_CURRENCY_CODE: ${DEMO_CURRENCY_CODE:-ZAR}
    depends_on:
      payments:
        condition: service_healthy

  payments:
    build:
      context: .
      dockerfile: Source/PaymentIntegration/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ACME_BASE_URL: ${ACME_BASE_URL:-http://acme:8080}
      PAYMENT_DATABASE_CONNECTION_STRING: ${PAYMENT_DATABASE_CONNECTION_STRING:-Host=db;Port=5432;Database=payment_integration;Username=payment_integration_app;Password=payment_integration_dev_only}
      ACME_API_KEY: ${ACME_API_KEY:-}
      ACME_MERCHANT_ID: ${ACME_MERCHANT_ID:-}
      ACME_ADVICE_USERNAME: ${ACME_ADVICE_USERNAME:-}
      ACME_ADVICE_PASSWORD: ${ACME_ADVICE_PASSWORD:-}
      ACME_WEBHOOK_SECRET: ${ACME_WEBHOOK_SECRET:-}
    ports:
      - "127.0.0.1:${PAYMENT_HTTP_PORT:-5080}:8080"
    depends_on:
      db:
        condition: service_healthy
      acme:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "PaymentIntegration.dll", "--health-check"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s
    stop_grace_period: 90s

  acme:
    build:
      context: .
      dockerfile: Source/AcmePay.Stub/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      # The running service validates its settings; unrelated services need none.
      ACME_API_KEY: ${ACME_API_KEY:-}
      ACME_MERCHANT_ID: ${ACME_MERCHANT_ID:-}
      ACME_ADVICE_URL: ${ACME_ADVICE_URL:-http://payments:8080/notifications/payment-advice}
      ACME_ADVICE_USERNAME: ${ACME_ADVICE_USERNAME:-}
      ACME_ADVICE_PASSWORD: ${ACME_ADVICE_PASSWORD:-}
      ACME_STATUS_WEBHOOK_URL: ${ACME_STATUS_WEBHOOK_URL:-http://payments:8080/notifications/transaction-status}
      ACME_WEBHOOK_SECRET: ${ACME_WEBHOOK_SECRET:-}
      ACME_ENABLE_CONTROLS: ${ACME_ENABLE_CONTROLS:-false}
    ports:
      - "127.0.0.1:${ACME_HTTP_PORT:-5081}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "dotnet", "AcmePay.Stub.dll", "--health-check"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s
    stop_grace_period: 30s

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: postgres
      # The official image rejects an empty admin password when db starts.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - type: volume
        source: paymentintegration_data
        target: /var/lib/postgresql
      - type: bind
        source: ./Source/PaymentIntegration/Database
        target: /opt/paymentintegration/database
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./Source/PaymentIntegration/Database/init
        target: /docker-entrypoint-initdb.d
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD-SHELL
        # Fixed development credentials from Database/setup.sql.
        - >-
          PGPASSWORD=payment_integration_dev_only PGCONNECT_TIMEOUT=3
          psql --no-psqlrc --no-password --host=127.0.0.1 --port=5432
          --username=payment_integration_app --dbname=payment_integration
          --set=ON_ERROR_STOP=1 --tuples-only --no-align
          --command='SELECT 1' >/dev/null
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: "no"
    stop_grace_period: 30s

volumes:
  paymentintegration_data:
